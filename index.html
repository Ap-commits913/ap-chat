<!DOCTYPE html>
<html lang="bn" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Chat — Ultimate Realtime Messenger</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        messenger: { black: '#000000', card: '#121212', input: '#242526', bubbleSent: '#0084ff', bubbleRecv: '#242526' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3a3b3c; border-radius: 9999px; }
        .chat-wallpaper-custom { background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; }
        .story-ring-active { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 2.5px; }
        .emoji-1 { font-size: 3rem; line-height: 1; }
        .emoji-2 { font-size: 2.2rem; line-height: 1; }
        .emoji-3 { font-size: 1.8rem; line-height: 1; }
        .emoji-4 { font-size: 1.5rem; line-height: 1; }
        .emoji-5 { font-size: 1.2rem; line-height: 1; }
    </style>
</head>
<body class="h-full select-none overflow-hidden bg-black text-white">

    <div id="app" class="h-full flex flex-col max-w-md md:max-w-xl mx-auto bg-black shadow-2xl relative border-x border-zinc-900">

        <!-- AUTH SCREEN -->
        <div id="screen-auth" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
            <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 p-6 rounded-3xl shadow-2xl space-y-6">
                <div class="text-center space-y-1">
                    <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-3xl font-black shadow-lg shadow-blue-600/40">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <h1 class="text-2xl font-black tracking-tight text-white pt-2">AP Chat</h1>
                    <p class="text-xs text-zinc-400">Realtime Network Platform</p>
                </div>

                <div class="flex bg-zinc-800 p-1 rounded-xl text-xs font-bold">
                    <button type="button" id="tab-login" onclick="setAuthTab('login')" class="flex-1 py-2 rounded-lg bg-zinc-700 text-white">Login</button>
                    <button type="button" id="tab-register" onclick="setAuthTab('register')" class="flex-1 py-2 rounded-lg text-zinc-400">Register</button>
                </div>

                <div id="auth-form" class="space-y-3 text-xs">
                    <div id="group-name" class="hidden">
                        <label class="block text-zinc-400 font-bold mb-1">FULL NAME</label>
                        <input type="text" id="auth-name" placeholder="আব্দুল্লাহ বিন ইলিয়াস" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl outline-none focus:border-blue-500 text-white">
                    </div>
                    <div>
                        <label class="block text-zinc-400 font-bold mb-1">EMAIL ADDRESS</label>
                        <input type="email" id="auth-email" placeholder="user@example.com" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl outline-none focus:border-blue-500 text-white">
                    </div>
                    <div>
                        <label class="block text-zinc-400 font-bold mb-1">PASSWORD</label>
                        <input type="password" id="auth-pass" placeholder="••••••••" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl outline-none focus:border-blue-500 text-white">
                    </div>
                    <button type="button" onclick="handleAuthAction()" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl shadow-lg shadow-blue-600/30 text-white transition mt-2">
                        Login Now
                    </button>
                </div>
            </div>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="screen-main" class="hidden flex-1 flex flex-col h-full relative">

            <header class="bg-black border-b border-zinc-900 px-4 py-3 flex items-center justify-between sticky top-0 z-30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-black text-white tracking-tight">AP Chat</span>
                    <span class="text-[10px] bg-blue-900/50 border border-blue-500/40 text-blue-400 px-2 py-0.5 rounded-full font-bold uppercase">LIVE</span>
                </div>
                <div class="flex items-center space-x-3 text-white">
                    <button onclick="openPostModal()" class="w-8 h-8 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-300 hover:bg-zinc-800"><i class="fa-solid fa-plus text-xs"></i></button>
                    <button onclick="switchTab('messenger')" class="w-8 h-8 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-300 hover:bg-zinc-800 relative">
                        <i class="fa-solid fa-comment-dots text-xs"></i>
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto custom-scrollbar relative">
                
                <!-- FEED TAB -->
                <div id="tab-feed" class="p-3 space-y-4">
                    <div class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800">
                        <div class="flex justify-between items-center text-xs font-bold mb-2">
                            <span>Stories (24h)</span>
                            <span onclick="openStoryModal()" class="text-blue-500 cursor-pointer">+ Add Story</span>
                        </div>
                        <div id="feed-stories-carousel" class="flex space-x-3 overflow-x-auto pb-1 custom-scrollbar"></div>
                    </div>

                    <div class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 flex items-center space-x-3">
                        <div id="my-avatar-icon" class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm overflow-hidden">A</div>
                        <input type="text" placeholder="What's on your mind?" onclick="openPostModal()" readonly class="flex-1 bg-zinc-800 px-4 py-2 rounded-full text-xs text-zinc-400 cursor-pointer">
                    </div>

                    <div id="posts-stream" class="space-y-4"></div>
                </div>

                <!-- MESSENGER INBOX TAB -->
                <div id="tab-messenger" class="hidden space-y-4 p-3">
                    <div id="inbox-list" class="space-y-1"></div>
                </div>

                <!-- CHAT CONVERSATION VIEW -->
                <div id="chat-conversation-view" class="hidden absolute inset-0 z-40 bg-black flex flex-col">
                    <div class="p-3 bg-zinc-950 border-b border-zinc-900 flex items-center justify-between z-10">
                        <div class="flex items-center space-x-3">
                            <button onclick="closeChatView()" class="text-blue-500 text-lg p-1"><i class="fa-solid fa-arrow-left"></i></button>
                            <div id="active-chat-avatar" class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">U</div>
                            <div>
                                <h3 id="active-chat-name" class="text-sm font-bold text-white">User Name</h3>
                                <p class="text-[10px] text-green-400">Online Realtime</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3 text-cyan-400 text-lg">
                            <label class="cursor-pointer" title="Set Chat Theme"><i class="fa-solid fa-palette text-sm"></i><input type="file" id="theme-file-input" accept="image/*" class="hidden" onchange="applyChatTheme(this)"></label>
                        </div>
                    </div>

                    <div id="chat-wallpaper-area" class="flex-1 chat-wallpaper-custom p-3 overflow-y-auto custom-scrollbar space-y-2 relative"></div>

                    <div id="media-preview-bar" class="hidden px-3 py-1 bg-zinc-900 border-t border-zinc-800 flex items-center justify-between text-xs">
                        <span id="media-preview-name" class="text-zinc-300 truncate">File attached</span>
                        <button onclick="cancelMediaAttach()" class="text-red-500 font-bold">Remove</button>
                    </div>

                    <div class="p-2 bg-black border-t border-zinc-900 flex items-center space-x-2 relative">
                        <label class="text-cyan-400 p-2 cursor-pointer" title="Send Photo"><i class="fa-solid fa-image text-lg"></i><input type="file" id="chat-photo-input" accept="image/*" class="hidden" onchange="prepareChatMedia(this, 'image')"></label>
                        <label class="text-cyan-400 p-2 cursor-pointer" title="Send Video"><i class="fa-solid fa-video text-lg"></i><input type="file" id="chat-video-input" accept="video/*" class="hidden" onchange="prepareChatMedia(this, 'video')"></label>
                        <input type="text" id="chat-text-input" placeholder="Aa" onkeypress="if(event.key==='Enter') sendRealtimeMessage()" class="flex-1 bg-zinc-900 border-none px-4 py-2 rounded-full text-xs outline-none text-white">
                        
                        <button id="quick-emoji-btn" onclick="sendQuickEmoji()" oncontextmenu="openQuickEmojiPicker(event)" class="text-xl px-1.5 py-1 text-cyan-400" title="Click to send, Right-click/Hold to change">👍</button>
                        
                        <button onclick="sendRealtimeMessage()" class="text-cyan-400 p-2"><i class="fa-solid fa-paper-plane text-lg"></i></button>
                    </div>
                </div>

                <!-- DISCOVER TAB -->
                <div id="tab-search" class="hidden p-3 space-y-3">
                    <h4 class="text-xs font-bold text-zinc-400 px-1">Registered Users</h4>
                    <div id="global-users-list" class="space-y-2"></div>
                </div>

                <!-- PROFILE TAB -->
                <div id="tab-profile" class="hidden p-4 space-y-4">
                    <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 text-center space-y-3">
                        <div class="relative w-20 h-20 mx-auto">
                            <div id="profile-avatar-box" class="w-20 h-20 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-3xl shadow-xl overflow-hidden">A</div>
                            <label class="absolute bottom-0 right-0 bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs cursor-pointer shadow"><i class="fa-solid fa-camera"></i><input type="file" accept="image/*" class="hidden" onchange="updateProfilePic(this)"></label>
                        </div>
                        <h2 id="profile-name-text" class="text-lg font-bold text-white">User</h2>
                        <p id="profile-email-text" class="text-xs text-zinc-400">email@example.com</p>
                        <div class="text-left pt-2">
                            <label class="block text-[10px] text-zinc-400 font-bold mb-1">BIO (Facebook Style)</label>
                            <div class="flex space-x-2">
                                <input type="text" id="profile-bio-input" placeholder="Write bio..." class="flex-1 bg-zinc-800 border border-zinc-700 p-2 rounded-xl text-xs text-white outline-none">
                                <button onclick="saveProfileBio()" class="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-bold">Save</button>
                            </div>
                        </div>
                    </div>
                    <button onclick="triggerLogout()" class="w-full bg-red-600/20 text-red-500 font-bold py-3 rounded-2xl border border-red-500/30 text-xs">Log Out</button>
                </div>

            </main>

            <nav class="bg-black border-t border-zinc-900 flex justify-around py-3 sticky bottom-0 z-30">
                <button onclick="switchTab('feed')" id="nav-btn-feed" class="text-blue-500 flex flex-col items-center"><i class="fa-solid fa-house text-lg"></i><span class="text-[9px] font-bold mt-0.5">Feed</span></button>
                <button onclick="switchTab('messenger')" id="nav-btn-messenger" class="text-zinc-500 flex flex-col items-center"><i class="fa-solid fa-comment text-lg"></i><span class="text-[9px] font-bold mt-0.5">Chats</span></button>
                <button onclick="switchTab('search')" id="nav-btn-search" class="text-zinc-500 flex flex-col items-center"><i class="fa-solid fa-users text-lg"></i><span class="text-[9px] font-bold mt-0.5">Discover</span></button>
                <button onclick="switchTab('profile')" id="nav-btn-profile" class="text-zinc-500 flex flex-col items-center"><i class="fa-solid fa-user text-lg"></i><span class="text-[9px] font-bold mt-0.5">Profile</span></button>
            </nav>
        </div>

        <!-- FULLSCREEN STORY VIEWER MODAL -->
        <div id="modal-story-viewer" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between p-4">
            <div class="flex justify-between items-center z-10">
                <div class="flex items-center space-x-2">
                    <div id="viewer-author-avatar" class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs overflow-hidden">U</div>
                    <span id="viewer-author-name" class="text-xs font-bold">Author</span>
                </div>
                <button onclick="closeStoryViewer()" class="text-white text-xl p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center relative overflow-hidden my-2">
                <div id="viewer-media-container" class="max-h-[60vh] max-w-full flex items-center justify-center"></div>
                <p id="viewer-story-caption" class="text-xs text-zinc-200 mt-2 text-center"></p>
            </div>
            <div class="bg-zinc-900/90 p-3 rounded-2xl border border-zinc-800 space-y-2">
                <div id="viewer-stats-owner" class="hidden space-y-1">
                    <div class="flex justify-between text-[11px] font-bold text-zinc-300">
                        <span id="story-views-count">Views: 0</span>
                        <span id="story-reactions-count">Reactions: 0</span>
                    </div>
                    <div id="story-viewers-list" class="text-[10px] text-zinc-400 truncate">Seen by: None yet</div>
                </div>
                <div id="viewer-reactions-other" class="flex justify-around pt-1 text-xl">
                    <button onclick="reactOnStory('❤️')">❤️</button>
                    <button onclick="reactOnStory('😆')">😆</button>
                    <button onclick="reactOnStory('😮')">😮</button>
                    <button onclick="reactOnStory('😢')">😢</button>
                    <button onclick="reactOnStory('🔥')">🔥</button>
                    <button onclick="reactOnStory('👍')">👍</button>
                </div>
            </div>
        </div>

        <!-- POST MODAL -->
        <div id="modal-post" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-4 space-y-3">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="font-bold text-xs text-white">Create Post</h3>
                    <button onclick="closePostModal()" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <textarea id="post-text" placeholder="What's on your mind?" class="w-full h-16 bg-zinc-800 border border-zinc-700 p-2.5 rounded-xl text-xs text-white outline-none resize-none"></textarea>
                <div>
                    <label class="block text-[10px] text-zinc-400 font-bold mb-1">ADD IMAGES OR VIDEO (< 1 MIN)</label>
                    <input type="file" id="post-files-input" accept="image/*,video/*" multiple class="w-full bg-zinc-800 border border-zinc-700 p-2 rounded-xl text-xs text-white outline-none" onchange="previewPostFiles(this)">
                </div>
                <div id="post-media-preview" class="grid grid-cols-3 gap-1 max-h-24 overflow-y-auto"></div>
                <div>
                    <label class="block text-[10px] text-zinc-400 font-bold mb-1">AUDIENCE PRIVACY</label>
                    <select id="post-privacy" class="w-full bg-zinc-800 border border-zinc-700 p-2 rounded-xl text-xs font-bold text-blue-400 outline-none">
                        <option value="🌐 Public">🌐 Public</option>
                        <option value="👥 Friends">👥 Friends Only</option>
                        <option value="🔒 Custom">🔒 Custom</option>
                        <option value="🚫 Hide From">🚫 Hide From Specific Users</option>
                    </select>
                </div>
                <button onclick="submitRealtimePost()" id="post-submit-btn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Post</button>
            </div>
        </div>

        <!-- STORY MODAL -->
        <div id="modal-story" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-4 space-y-3">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="font-bold text-xs text-white">Create Story</h3>
                    <button onclick="closeStoryModal()" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-400 font-bold mb-1">SELECT FILE (PHOTO/VIDEO < 1 MIN)</label>
                    <input type="file" id="story-file-input" accept="image/*,video/*" class="w-full bg-zinc-800 border border-zinc-700 p-2 rounded-xl text-xs text-white outline-none" onchange="previewStoryMedia(this)">
                </div>
                <div id="story-preview-container" class="hidden text-center max-h-36 overflow-hidden"></div>
                <input type="text" id="story-caption" placeholder="Add caption..." class="w-full bg-zinc-800 border border-zinc-700 p-2.5 rounded-xl text-xs text-white outline-none">
                <div>
                    <label class="block text-[10px] text-zinc-400 font-bold mb-1">STORY PRIVACY</label>
                    <select id="story-privacy" class="w-full bg-zinc-800 border border-zinc-700 p-2 rounded-xl text-xs font-bold text-blue-400 outline-none">
                        <option value="🌐 Public">🌐 Public</option>
                        <option value="👥 Friends">👥 Friends Only</option>
                        <option value="🔒 Custom">🔒 Custom</option>
                        <option value="🚫 Hide From">🚫 Hide From Specific Users</option>
                    </select>
                </div>
                <button onclick="submitRealtimeStory()" id="story-submit-btn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Publish Story</button>
            </div>
        </div>

        <!-- PROFILE CROP MODAL -->
        <div id="modal-crop" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-4 space-y-3 text-center">
                <h3 class="font-bold text-xs text-white">Crop Profile Picture</h3>
                <img id="crop-source-img" class="max-h-48 mx-auto rounded-full object-cover border-2 border-blue-500">
                <button onclick="confirmCropAndSave()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Crop & Save</button>
            </div>
        </div>

        <!-- PRIVACY EDIT MODAL -->
        <div id="modal-edit-privacy" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-4 space-y-3">
                <h3 class="font-bold text-xs text-white">Change Privacy</h3>
                <select id="edit-privacy-select" class="w-full bg-zinc-800 border border-zinc-700 p-2.5 rounded-xl text-xs font-bold text-blue-400 outline-none">
                    <option value="🌐 Public">🌐 Public</option>
                    <option value="👥 Friends">👥 Friends Only</option>
                    <option value="🔒 Custom">🔒 Custom</option>
                    <option value="🚫 Hide From">🚫 Hide From Specific Users</option>
                </select>
                <button onclick="saveItemPrivacy()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Update</button>
                <button onclick="document.getElementById('modal-edit-privacy').classList.add('hidden')" class="w-full bg-zinc-800 text-zinc-300 font-bold py-2 rounded-xl text-xs">Cancel</button>
            </div>
        </div>

        <!-- MESSAGE REACTION PICKER MODAL -->
        <div id="modal-msg-reactions" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center" onclick="closeMsgReactionPicker()">
            <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-full flex space-x-3 text-2xl shadow-2xl" onclick="event.stopPropagation()">
                <button onclick="reactOnMessage('❤️')">❤️</button>
                <button onclick="reactOnMessage('😆')">😆</button>
                <button onclick="reactOnMessage('😮')">😮</button>
                <button onclick="reactOnMessage('😢')">😢</button>
                <button onclick="reactOnMessage('🔥')">🔥</button>
                <button onclick="reactOnMessage('👍')">👍</button>
            </div>
        </div>

    </div>

    <!-- FIREBASE MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdLGspLUDEQRRf_Hr8655pJrm889BDr0g",
            authDomain: "ap-chat-live-5f0c9.firebaseapp.com",
            databaseURL: "https://ap-chat-live-5f0c9-default-rtdb.firebaseio.com",
            projectId: "ap-chat-live-5f0c9",
            storageBucket: "ap-chat-live-5f0c9.firebasestorage.app",
            messagingSenderId: "741988607038",
            appId: "1:741988607038:web:dc8ca63a93f94ee9ae1d6f",
            measurementId: "G-RS7DT10GT9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentUser = null;
        let activePeer = null;
        let currentAuthMode = 'login';
        let chatUnsubscribe = null;
        let pendingMediaFile = null;
        let tempProfileFile = null;
        let tempStoryFile = null;
        let tempPostFilesList = [];
        let activeEditItem = null;
        let activeStoryDocId = null;
        let activeMessageIdForReaction = null;
        let quickEmojiSymbol = '👍';

        window.setAuthTab = (mode) => {
            currentAuthMode = mode;
            const isReg = mode === 'register';
            document.getElementById('group-name').classList.toggle('hidden', !isReg);
            document.getElementById('tab-login').className = !isReg ? "flex-1 py-2 rounded-lg bg-zinc-700 text-white" : "flex-1 py-2 rounded-lg text-zinc-400";
            document.getElementById('tab-register').className = isReg ? "flex-1 py-2 rounded-lg bg-zinc-700 text-white" : "flex-1 py-2 rounded-lg text-zinc-400";
            document.getElementById('auth-submit-btn').innerText = isReg ? "Register Account" : "Login Now";
        };

        window.handleAuthAction = async () => {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            const name = document.getElementById('auth-name').value.trim() || "User";

            if(!email || !pass) {
                alert("Please enter both email and password!");
                return;
            }

            try {
                if(currentAuthMode === 'register') {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), {
                        uid: res.user.uid,
                        name: name,
                        email: email,
                        bio: "Hey there! I am using AP Chat.",
                        avatarUrl: "",
                        createdAt: Date.now()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch(err) {
                alert("Authentication Failed: " + err.message);

        window.openRealtimeChat = (peerUid, peerName) => {
            activePeer = { uid: peerUid, name: peerName };
            document.getElementById('chat-conversation-view').classList.remove('hidden');
            document.getElementById('active-chat-name').innerText = peerName;
            document.getElementById('active-chat-avatar').innerText = peerName.charAt(0).toUpperCase();

            const chatId = currentUser.uid < peerUid ? `${currentUser.uid}_${peerUid}` : `${peerUid}_${currentUser.uid}`;
            if(chatUnsubscribe) chatUnsubscribe();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            chatUnsubscribe = onSnapshot(q, (snapshot) => {
                const area = document.getElementById('chat-wallpaper-area');
                area.innerHTML = '';
                let lastTimestamp = 0;

                snapshot.forEach((docSnap) => {
                    const msg = { id: docSnap.id, ...docSnap.data() };
                    if(msg.deletedFor && msg.deletedFor.includes(currentUser.uid)) return;

                    const isMe = msg.senderUid === currentUser.uid;
                    const showTime = (msg.timestamp - lastTimestamp) > 30 * 60 * 1000;
                    lastTimestamp = msg.timestamp;
                    const timeStr = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                    if(!isMe && msg.status !== 'seen') {
                        updateDoc(doc(db, "chats", chatId, "messages", msg.id), { status: 'seen' });
                    }

                    let contentHtml = '';
                    let isOnlyEmojis = false;

                    if(msg.type === 'image') {
                        contentHtml = `<img src="${msg.mediaUrl}" class="rounded-xl max-h-48 object-cover mb-1">`;
                    } else if(msg.type === 'video') {
                        contentHtml = `<video src="${msg.mediaUrl}" controls class="rounded-xl max-h-48 object-cover mb-1"></video>`;
                    } else if(msg.text) {
                        const trimmed = msg.text.trim();
                        const emojiRegex = /^(\p{Extended_Pictographic}|\p{Emoji_Component}|\s)+$/u;
                        if(emojiRegex.test(trimmed)) {
                            isOnlyEmojis = true;
                            const emojiArray = Array.from(trimmed.replace(/\s+/g, ''));
                            const count = emojiArray.length;
                            let emojiClass = 'emoji-1';
                            if(count === 2) emojiClass = 'emoji-2';
                            else if(count === 3) emojiClass = 'emoji-3';
                            else if(count === 4) emojiClass = 'emoji-4';
                            else if(count >= 5) emojiClass = 'emoji-5';

                            contentHtml = `<div class="${emojiClass}">${trimmed}</div>`;
                        } else {
                            contentHtml = `<p>${msg.text}</p>`;
                        }
                    }

                    let statusIcon = '<i class="fa-solid fa-check text-[9px] text-zinc-400"></i>';
                    if(msg.status === 'delivered') statusIcon = '<i class="fa-solid fa-check-double text-[9px] text-zinc-400"></i>';
                    else if(msg.status === 'seen') statusIcon = '<i class="fa-solid fa-check-double text-[9px] text-blue-400"></i>';

                    const bubbleStyle = isOnlyEmojis ? 'bg-transparent shadow-none p-0' : `${isMe ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none' : 'bg-zinc-800 text-white rounded-2xl rounded-tl-none'} p-3 text-xs shadow-md`;

                    area.innerHTML += `
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1 group" oncontextmenu="openMsgReactionModal(event, '${msg.id}')" onclick="openMsgReactionModal(event, '${msg.id}')">
                            <div class="max-w-[80%] ${bubbleStyle} relative cursor-pointer">
                                ${contentHtml}
                                ${msg.reaction ? `<span class="absolute -bottom-2 ${isMe ? 'left-1' : 'right-1'} bg-zinc-900 border border-zinc-700 px-1.5 py-0.2 rounded-full text-[10px]">${msg.reaction}</span>` : ''}
                            </div>
                            <div class="flex items-center space-x-1 mt-0.5 px-1 ${showTime ? 'flex' : 'hidden'}">
                                <span class="text-[9px] text-zinc-500">${timeStr}</span>
                                ${isMe ? statusIcon : ''}
                            </div>
                        </div>
                    `;
                });
                area.scrollTop = area.scrollHeight;
            });
        };

                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Service Worker registered!', reg))
                    .catch((err) => console.log('Service Worker registration failed', err));
            });
        }
    </script>
</body>
