<!DOCTYPE html>
<html lang="bn" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Chat — Realtime Messenger Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        messenger: { black: '#000000', card: '#121212', input: '#242526', bubbleSent: '#0084ff', bubbleRecv: '#242526' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3a3b3c; border-radius: 9999px; }
        .chat-wallpaper-floral {
            background-color: #0a0a16;
            background-image: radial-gradient(#1e1d45 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }
        .story-ring-active { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 2.5px; }
    </style>
</head>
<body class="h-full select-none overflow-hidden bg-black text-white">

    <div id="app" class="h-full flex flex-col max-w-md md:max-w-xl mx-auto bg-black shadow-2xl relative border-x border-zinc-900">

        <!-- AUTHENTICATION SCREEN -->
        <div id="screen-auth" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
            <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 p-6 rounded-3xl shadow-2xl space-y-6">
                <div class="text-center space-y-1">
                    <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-3xl font-black shadow-lg shadow-blue-600/40">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <h1 class="text-2xl font-black tracking-tight text-white pt-2">AP Chat</h1>
                    <p class="text-xs text-zinc-400">Realtime Network Platform</p>
                </div>

                <div class="flex bg-zinc-800 p-1 rounded-xl text-xs font-bold">
                    <button id="tab-login" onclick="setAuthTab('login')" class="flex-1 py-2 rounded-lg bg-zinc-700 text-white">Login</button>
                    <button id="tab-register" onclick="setAuthTab('register')" class="flex-1 py-2 rounded-lg text-zinc-400">Register</button>
                </div>

                <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3 text-xs">
                    <div id="group-name" class="hidden">
                        <label class="block text-zinc-400 font-bold mb-1">FULL NAME</label>
                        <input type="text" id="auth-name" placeholder="আব্দুল্লাহ বিন ইলিয়াস" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl outline-none focus:border-blue-500 text-white">
                    </div>
                    <div>
                        <label class="block text-zinc-400 font-bold mb-1">EMAIL ADDRESS</label>
                        <input type="email" id="auth-email" required placeholder="user@example.com" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl outline-none focus:border-blue-500 text-white">
                    </div>
                    <div>
                        <label class="block text-zinc-400 font-bold mb-1">PASSWORD</label>
                        <input type="password" id="auth-pass" required placeholder="••••••••" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl outline-none focus:border-blue-500 text-white">
                    </div>
                    <button type="submit" id="auth-btn-text" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl shadow-lg shadow-blue-600/30 text-white transition mt-2">
                        Continue
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="screen-main" class="hidden flex-1 flex flex-col h-full relative">

            <header class="bg-black border-b border-zinc-900 px-4 py-3 flex items-center justify-between sticky top-0 z-30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-black text-white tracking-tight">AP Chat</span>
                    <span id="user-display-tag" class="text-[10px] bg-blue-900/50 border border-blue-500/40 text-blue-400 px-2 py-0.5 rounded-full font-bold uppercase">LIVE</span>
                </div>
                <div class="flex items-center space-x-3 text-white">
                    <button onclick="openPostModal()" class="w-8 h-8 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-300 hover:bg-zinc-800"><i class="fa-solid fa-plus text-xs"></i></button>
                    <button onclick="switchTab('messenger')" class="w-8 h-8 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-300 hover:bg-zinc-800 relative">
                        <i class="fa-solid fa-comment-dots text-xs"></i>
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto custom-scrollbar relative">
                
                <!-- FEED TAB -->
                <div id="tab-feed" class="p-3 space-y-4">
                    <div class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800">
                        <div class="flex justify-between items-center text-xs font-bold mb-2">
                            <span>Stories (24h)</span>
                            <span onclick="openStoryModal()" class="text-blue-500 cursor-pointer">+ Add Story</span>
                        </div>
                        <div id="feed-stories-carousel" class="flex space-x-3 overflow-x-auto pb-1 custom-scrollbar"></div>
                    </div>

                    <div class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 flex items-center space-x-3">
                        <div id="my-avatar-icon" class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm">A</div>
                        <input type="text" placeholder="What's on your mind?" onclick="openPostModal()" readonly class="flex-1 bg-zinc-800 px-4 py-2 rounded-full text-xs text-zinc-400 cursor-pointer">
                    </div>

                    <div id="posts-stream" class="space-y-4"></div>
                </div>

                <!-- MESSENGER INBOX TAB -->
                <div id="tab-messenger" class="hidden space-y-4 p-3">
                    <div id="inbox-list" class="space-y-1"></div>
                </div>

                <!-- CHAT CONVERSATION VIEW -->
                <div id="chat-conversation-view" class="hidden absolute inset-0 z-40 bg-black flex flex-col">
                    <div class="p-3 bg-zinc-950 border-b border-zinc-900 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <button onclick="closeChatView()" class="text-blue-500 text-lg p-1"><i class="fa-solid fa-arrow-left"></i></button>
                            <div id="active-chat-avatar" class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">U</div>
                            <div>
                                <h3 id="active-chat-name" class="text-sm font-bold text-white">User Name</h3>
                                <p class="text-[10px] text-green-400">Online Realtime</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4 text-cyan-400 text-lg">
                            <i class="fa-solid fa-phone cursor-pointer" onclick="alert('Audio calling feature queued for WebRTC module.')"></i>
                            <i class="fa-solid fa-video cursor-pointer" onclick="alert('Video calling feature queued for WebRTC module.')"></i>
                        </div>
                    </div>

                    <div id="chat-wallpaper-area" class="flex-1 chat-wallpaper-floral p-3 overflow-y-auto custom-scrollbar space-y-3 relative"></div>

                    <div class="p-2 bg-black border-t border-zinc-900 flex items-center space-x-2">
                        <button onclick="alert('Voice recording queued.')" class="text-cyan-400 p-2"><i class="fa-solid fa-microphone text-lg"></i></button>
                        <input type="text" id="chat-text-input" placeholder="Message..." onkeypress="if(event.key==='Enter') sendRealtimeMessage()" class="flex-1 bg-zinc-900 border-none px-4 py-2 rounded-full text-xs outline-none text-white">
                        <button onclick="sendRealtimeMessage()" class="text-cyan-400 p-2"><i class="fa-solid fa-paper-plane text-lg"></i></button>
                    </div>
                </div>

                <!-- DISCOVER / SEARCH USER TAB -->
                <div id="tab-search" class="hidden p-3 space-y-3">
                    <h4 class="text-xs font-bold text-zinc-400 px-1">Registered Users Across World</h4>
                    <div id="global-users-list" class="space-y-2"></div>
                </div>

                <!-- PROFILE TAB -->
                <div id="tab-profile" class="hidden p-4 space-y-4">
                    <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 text-center space-y-3">
                        <div id="profile-avatar-box" class="w-20 h-20 bg-blue-600 text-white rounded-full mx-auto flex items-center justify-center font-bold text-3xl shadow-xl">A</div>
                        <h2 id="profile-name-text" class="text-lg font-bold text-white">User</h2>
                        <p id="profile-email-text" class="text-xs text-zinc-400">email@example.com</p>
                    </div>
                    <button onclick="triggerLogout()" class="w-full bg-red-600/20 text-red-500 font-bold py-3 rounded-2xl border border-red-500/30 text-xs">Log Out</button>
                </div>

            </main>

            <nav class="bg-black border-t border-zinc-900 flex justify-around py-3 sticky bottom-0 z-30">
                <button onclick="switchTab('feed')" id="nav-btn-feed" class="text-blue-500 flex flex-col items-center"><i class="fa-solid fa-house text-lg"></i><span class="text-[9px] font-bold mt-0.5">Feed</span></button>
                <button onclick="switchTab('messenger')" id="nav-btn-messenger" class="text-zinc-500 flex flex-col items-center"><i class="fa-solid fa-comment text-lg"></i><span class="text-[9px] font-bold mt-0.5">Chats</span></button>
                <button onclick="switchTab('search')" id="nav-btn-search" class="text-zinc-500 flex flex-col items-center"><i class="fa-solid fa-users text-lg"></i><span class="text-[9px] font-bold mt-0.5">Discover</span></button>
                <button onclick="switchTab('profile')" id="nav-btn-profile" class="text-zinc-500 flex flex-col items-center"><i class="fa-solid fa-user text-lg"></i><span class="text-[9px] font-bold mt-0.5">Profile</span></button>
            </nav>
        </div>

        <!-- POST MODAL -->
        <div id="modal-post" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-4 space-y-3">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="font-bold text-xs text-white">Create Feed Post</h3>
                    <button onclick="closePostModal()" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <textarea id="post-text" placeholder="Write something..." class="w-full h-20 bg-zinc-800 border border-zinc-700 p-2.5 rounded-xl text-xs text-white outline-none resize-none"></textarea>
                <button onclick="submitRealtimePost()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Post</button>
            </div>
        </div>

        <!-- STORY MODAL WITH IMAGE UPLOAD -->
        <div id="modal-story" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-4 space-y-3">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="font-bold text-xs text-white">Add Photo Story</h3>
                    <button onclick="closeStoryModal()" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-400 font-bold mb-1">SELECT IMAGE</label>
                    <input type="file" id="story-file-input" accept="image/*" class="w-full bg-zinc-800 border border-zinc-700 p-2 rounded-xl text-xs text-white outline-none">
                </div>
                <input type="text" id="story-caption" placeholder="Add story caption..." class="w-full bg-zinc-800 border border-zinc-700 p-2.5 rounded-xl text-xs text-white outline-none">
                <button onclick="submitRealtimeStory()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Publish Story</button>
            </div>
        </div>

    </div>

    <!-- FIREBASE MODULE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, onSnapshot, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdLGspLUDEQRRf_Hr8655pJrm889BDr0g",
            authDomain: "ap-chat-live-5f0c9.firebaseapp.com",
            databaseURL: "https://ap-chat-live-5f0c9-default-rtdb.firebaseio.com",
            projectId: "ap-chat-live-5f0c9",
            storageBucket: "ap-chat-live-5f0c9.firebasestorage.app",
            messagingSenderId: "741988607038",
            appId: "1:741988607038:web:dc8ca63a93f94ee9ae1d6f",
            measurementId: "G-RS7DT10GT9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activePeer = null;
        let currentAuthMode = 'login';
        let chatUnsubscribe = null;

        window.setAuthTab = (mode) => {
            currentAuthMode = mode;
            const isReg = mode === 'register';
            document.getElementById('group-name').classList.toggle('hidden', !isReg);
            document.getElementById('tab-login').className = !isReg ? "flex-1 py-2 rounded-lg bg-zinc-700 text-white" : "flex-1 py-2 rounded-lg text-zinc-400";
            document.getElementById('tab-register').className = isReg ? "flex-1 py-2 rounded-lg bg-zinc-700 text-white" : "flex-1 py-2 rounded-lg text-zinc-400";
        };

        window.handleAuthSubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const name = document.getElementById('auth-name').value || "User";

            try {
                if(currentAuthMode === 'register') {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), {
                        uid: res.user.uid,
                        name: name,
                        email: email,
                        createdAt: Date.now()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch(err) {
                alert("Auth Error: " + err.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if(user) {
                currentUser = user;
                document.getElementById('screen-auth').classList.add('hidden');
                document.getElementById('screen-main').classList.remove('hidden');
                
                document.getElementById('profile-email-text').innerText = user.email;
                
                listenGlobalUsers();
                listenPosts();
                listenStories();
            } else {
                currentUser = null;
                document.getElementById('screen-main').classList.add('hidden');
                document.getElementById('screen-auth').classList.remove('hidden');
            }
        });

        window.triggerLogout = () => signOut(auth);

        function listenGlobalUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const list = document.getElementById('global-users-list');
                const inbox = document.getElementById('inbox-list');
                list.innerHTML = '';
                inbox.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const u = docSnap.data();
                    if(u.uid === currentUser.uid) {
                        document.getElementById('profile-name-text').innerText = u.name;
                        document.getElementById('my-avatar-icon').innerText = u.name.charAt(0).toUpperCase();
                        document.getElementById('profile-avatar-box').innerText = u.name.charAt(0).toUpperCase();
                        return;
                    }

                    list.innerHTML += `
                        <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm text-white">${u.name.charAt(0).toUpperCase()}</div>
                                <div>
                                    <h5 class="text-xs font-bold text-white">${u.name}</h5>
                                    <p class="text-[10px] text-zinc-400">${u.email}</p>
                                </div>
                            </div>
                            <button onclick="openRealtimeChat('${u.uid}', '${u.name}')" class="bg-blue-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg">Message</button>
                        </div>
                    `;

                    inbox.innerHTML += `
                        <div onclick="openRealtimeChat('${u.uid}', '${u.name}')" class="p-3 rounded-2xl hover:bg-zinc-900 flex items-center space-x-3 cursor-pointer border-b border-zinc-900">
                            <div class="w-11 h-11 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm text-white">${u.name.charAt(0).toUpperCase()}</div>
                            <div class="flex-1">
                                <h4 class="font-bold text-xs text-white">${u.name}</h4>
                                <p class="text-[10px] text-zinc-500">Tap to chat in realtime</p>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.openRealtimeChat = (peerUid, peerName) => {
            activePeer = { uid: peerUid, name: peerName };
            document.getElementById('chat-conversation-view').classList.remove('hidden');
            document.getElementById('active-chat-name').innerText = peerName;
            document.getElementById('active-chat-avatar').innerText = peerName.charAt(0).toUpperCase();

            const chatId = currentUser.uid < peerUid ? `${currentUser.uid}_${peerUid}` : `${peerUid}_${currentUser.uid}`;
            
            if(chatUnsubscribe) chatUnsubscribe();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            chatUnsubscribe = onSnapshot(q, (snapshot) => {
                const area = document.getElementById('chat-wallpaper-area');
                area.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = msg.senderUid === currentUser.uid;
                    area.innerHTML += `
                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="max-w-[80%] ${isMe ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none' : 'bg-zinc-800 text-white rounded-2xl rounded-tl-none'} p-3 text-xs shadow-md">
                                <p>${msg.text}</p>
                            </div>
                        </div>
                    `;
                });
                area.scrollTop = area.scrollHeight;
            });
        };

        window.closeChatView = () => {
            document.getElementById('chat-conversation-view').classList.add('hidden');
            if(chatUnsubscribe) chatUnsubscribe();
        };

        window.sendRealtimeMessage = async () => {
            const input = document.getElementById('chat-text-input');
            const text = input.value.trim();
            if(!text || !activePeer) return;

            const chatId = currentUser.uid < activePeer.uid ? `${currentUser.uid}_${activePeer.uid}` : `${activePeer.uid}_${currentUser.uid}`;
            input.value = '';

            await addDoc(collection(db, "chats", chatId, "messages"), {
                senderUid: currentUser.uid,
                text: text,
                timestamp: Date.now()
            });
        };

        window.submitRealtimePost = async () => {
            const text = document.getElementById('post-text').value.trim();
            if(!text) return;
            await addDoc(collection(db, "posts"), {
                authorName: document.getElementById('profile-name-text').innerText || "User",
                text: text,
                timestamp: Date.now()
            });
            document.getElementById('post-text').value = '';
            closePostModal();
        };

        function listenPosts() {
            const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const stream = document.getElementById('posts-stream');
                stream.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    stream.innerHTML += `
                        <div class="bg-zinc-900 p-3 rounded-2xl border border-zinc-800 space-y-2 text-xs">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-white">${p.authorName}</span>
                                <span class="text-[9px] text-zinc-500">${new Date(p.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            </div>
                            <p class="text-zinc-300">${p.text}</p>
                        </div>
                    `;
                });
            });
        }

        window.submitRealtimeStory = async () => {
            const fileInput = document.getElementById('story-file-input');
            const caption = document.getElementById('story-caption').value;
            
            if(fileInput.files.length === 0) {
                alert("Please select an image file for your story!");
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                const imgDataUrl = e.target.result;
                await addDoc(collection(db, "stories"), {
                    authorName: document.getElementById('profile-name-text').innerText || "User",
                    imageUrl: imgDataUrl,
                    caption: caption,
                    timestamp: Date.now()
                });
                closeStoryModal();
            };
            reader.readAsDataURL(fileInput.files[0]);
        };

        function listenStories() {
            const q = query(collection(db, "stories"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const carousel = document.getElementById('feed-stories-carousel');
                carousel.innerHTML = `
                    <div onclick="openStoryModal()" class="flex-shrink-0 w-16 h-24 bg-zinc-800 rounded-2xl border border-dashed border-zinc-700 flex flex-col items-center justify-center cursor-pointer">
                        <span class="text-xl text-blue-500 font-bold">+</span>
                        <span class="text-[9px] text-zinc-400 font-bold">Add Photo</span>
                    </div>
                `;
                snapshot.forEach((docSnap) => {
                    const s = docSnap.data();
                    carousel.innerHTML += `
                        <div class="flex-shrink-0 w-16 h-24 story-ring-active rounded-2xl overflow-hidden relative cursor-pointer">
                            <img src="${s.imageUrl}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent p-1 flex items-end">
                                <span class="text-[8px] font-bold text-white truncate">${s.authorName}</span>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.switchTab = (tab) => {
            ['feed', 'messenger', 'search', 'profile'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-btn-${t}`).className = "text-zinc-500 flex flex-col items-center";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-btn-${tab}`).className = "text-blue-500 flex flex-col items-center";
        };

        window.openPostModal = () => document.getElementById('modal-post').classList.remove('hidden');
        window.closePostModal = () => document.getElementById('modal-post').classList.add('hidden');
        window.openStoryModal = () => document.getElementById('modal-story').classList.remove('hidden');
        window.closeStoryModal = () => document.getElementById('modal-story').classList.add('hidden');
    </script>
</body>
</html>
